<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マニュアル</title>
  <!-- コードの色分け（highlight.js）。OS のライト／ダーク設定で配色を切り替える -->
  <link rel="stylesheet" href="vendor/highlight/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="vendor/highlight/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/highlight/highlight.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="book-icon" aria-hidden="true"></span>
        <h1 class="book-title" id="bookTitle">マニュアル</h1>
        <button class="sidebar-close" id="sidebarClose" aria-label="目次をしまう" title="目次をしまう"><span aria-hidden="true">«</span></button>
      </div>
      <nav class="toc" id="toc" aria-label="目次"></nav>
      <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-orientation="vertical" aria-label="目次の幅を変える" title="ドラッグで幅を変える（ダブルクリックで元に戻す）"></div>
    </aside>

    <main class="stage" id="stage">
      <header class="stage-head">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="目次を出す" title="目次を出す">☰</button>
        <div class="crumbs" id="crumbs"></div>
        <div class="counter" id="counter"></div>
      </header>

      <div class="viewport" id="viewport">
        <div class="track" id="track"></div>
      </div>

      <button class="nav-btn prev" id="prevBtn" aria-label="前のページ">‹</button>
      <button class="nav-btn next" id="nextBtn" aria-label="次のページ">›</button>
      <button class="top-btn" id="topBtn" aria-label="ページの先頭へ戻る" title="ページの先頭へ戻る"><span aria-hidden="true">›</span></button>

      <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
